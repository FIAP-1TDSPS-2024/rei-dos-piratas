<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu carrinho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <th:block th:replace="~{fragments.html :: head-scripts}"></th:block>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">

<div th:replace="~{fragments.html :: navbar}"></div>

<main class="max-w-screen-lg w-full mx-auto px-4 py-8 flex-1">
    <h1 class="text-2xl font-black mb-2">Meu carrinho</h1>
    <div th:replace="~{fragments.html :: flash-messages}"></div>

    <div th:if="${#lists.isEmpty(carrinho.produtosAdicionados)}" class="mt-6 bg-white rounded-xl shadow p-8 text-center">
        <p class="text-gray-600 mb-4">Seu carrinho está vazio.</p>
        <a th:href="@{/web/produtos}" class="inline-block px-4 py-2 bg-yellow-400 font-bold rounded-xl hover:bg-yellow-500">Ver produtos</a>
    </div>

    <div th:unless="${#lists.isEmpty(carrinho.produtosAdicionados)}" class="mt-6 bg-white rounded-xl shadow divide-y">
        <div th:each="item : ${carrinho.produtosAdicionados}" class="p-4 flex items-center gap-4">
            <img th:src="${item.produto.enderecoImagem}" alt="" class="w-16 h-20 object-cover rounded">
            <div class="flex-1">
                <a th:href="@{/web/produtos/{id}(id=${item.produto.id})}" class="font-semibold hover:underline"
                   th:text="${item.produto.nome}">Produto</a>
                <p class="text-sm text-gray-500">
                    <span th:text="${item.quantidade}">1</span> x
                    <span th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span>
                </p>
            </div>
            <p class="font-bold w-28 text-right"
               th:text="${'R$ ' + #numbers.formatDecimal(item.subtotal(), 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
            <form th:action="@{/web/conta/carrinho/remover}" method="post" class="flex items-center gap-2">
                <input type="hidden" name="produtoId" th:value="${item.produto.id}">
                <input type="number" name="quantidade" value="1" min="1" th:max="${item.quantidade}"
                       class="w-16 border rounded px-2 py-1 text-sm">
                <button type="submit" class="px-3 py-1 text-sm bg-red-100 text-red-700 rounded hover:bg-red-200">Remover</button>
            </form>
        </div>
        <div class="p-4 flex items-center justify-between">
            <p class="text-lg">Total dos itens:
                <span class="font-black" th:text="${'R$ ' + #numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span>
                <span class="text-sm text-gray-500">(frete calculado no checkout)</span>
            </p>
            <a th:href="@{/web/conta/checkout}"
               class="px-5 py-2 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700">Finalizar compra</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments.html :: footer}"></div>
</body>
</html>
