<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{pedidos.organizar.page.title}">Organizar Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
<div class="max-w-5xl mx-auto p-4">

    <div th:replace="~{fragments.html :: navbar}"></div>

    <div th:replace="~{fragments.html :: flash-messages}"></div>

    <div class="bg-white p-6 mt-4 shadow-md rounded-md">

        <div th:replace="~{fragments.html :: pedidos-page-header(#{pedidos.organizar.titulo}, #{pedidos.organizar.subtitulo})}"></div>

        <!-- Sem pedidos -->
        <div th:if="${pedidos == null or pedidos.isEmpty()}"
             th:replace="~{fragments.html :: pedidos-vazio-clipboard(#{pedidos.organizar.vazio}, @{/web/pedidos}, #{common.voltar})}"></div>

        <!-- Formulário de seleção -->
        <form th:if="${pedidos != null and !pedidos.isEmpty()}"
              th:action="@{/web/pedidos/organizar}" method="post">

            <th:block th:replace="~{fragments.html :: pedidos-selecao-tabela}"></th:block>

            <!-- Ações do formulário -->
            <div class="mt-6 flex gap-3 justify-end">
                <a th:href="@{/web/pedidos}"
                   class="px-4 py-2 border border-gray-300 text-gray-700 text-sm font-semibold rounded hover:bg-gray-100 transition"
                   th:text="#{common.cancelar}">Cancelar</a>
                <button type="submit"
                        class="px-6 py-2 bg-blue-600 text-white text-sm font-semibold rounded hover:bg-blue-700 transition"
                        th:text="#{pedidos.organizar.confirmar}">Organizar Selecionados</button>
            </div>
        </form>
    </div>

    <div th:replace="~{fragments.html :: footer}"></div>
</div>
</body>
</html>
