<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Rei dos Piratas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex items-center justify-center">

<div class="w-full max-w-md mx-auto p-4">

    <!-- Logo -->
    <div class="text-center mb-8">
        <a href="/web/produtos" class="inline-flex items-center space-x-2 text-2xl font-bold text-gray-800">
            <span class="text-yellow-400 text-3xl">&#9678;</span>
            <span>Rei dos Piratas</span>
        </a>
        <p class="text-gray-500 mt-1 text-sm">Acesso para funcionários</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-xl shadow-md p-8">

        <h2 class="text-xl font-bold text-gray-800 mb-6">Entrar</h2>

        <!-- Mensagem de erro -->
        <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-md flex items-center gap-2 text-sm">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span id="errorText">Credenciais inválidas.</span>
        </div>

        <!--
            O formulário submete via JS para /auth/login (mesmo endpoint da API).
            O token JWT retornado é salvo em cookie e reutilizado pelo JwtAuthenticationFilter
            tanto para chamadas de API quanto para as páginas Thymeleaf — um único método de autenticação.
        -->
        <form id="loginForm" class="space-y-5">

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 transition"
                       placeholder="seu@email.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 transition"
                       placeholder="••••••••">
            </div>

            <button type="submit"
                    class="w-full py-2 px-4 bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-semibold rounded-md transition">
                Entrar
            </button>

        </form>

        <div class="mt-6 text-center">
            <a href="/web/produtos" class="text-sm text-gray-500 hover:text-gray-700 transition">
                ← Voltar para a loja
            </a>
        </div>

    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email    = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (!response.ok) {
                showError('Credenciais inválidas. Verifique seu e-mail e senha.');
                return;
            }

            const data = await response.json();

            // Salva o JWT em cookie acessível ao servidor (HttpOnly não pode ser definido via JS,
            // mas o JwtAuthenticationFilter lê o cookie "jwt_token" em todas as requisições)
            const expiresDate = new Date(Date.now() + 86400 * 1000).toUTCString();
            document.cookie = `jwt_token=${data.token}; path=/; expires=${expiresDate}; SameSite=Strict`;

            window.location.href = '/web/produtos';

        } catch (err) {
            showError('Erro ao conectar. Tente novamente.');
        }
    });

    function showError(msg) {
        const el = document.getElementById('errorMessage');
        document.getElementById('errorText').textContent = msg;
        el.classList.remove('hidden');
    }
</script>
</body>
</html>
