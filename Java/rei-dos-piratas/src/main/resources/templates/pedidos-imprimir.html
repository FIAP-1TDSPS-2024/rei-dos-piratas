<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{pedidos.imprimir.page.title}">Imprimir Etiquetas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">

<div th:replace="~{fragments.html :: navbar}"></div>

<div class="max-w-screen-2xl mx-auto px-4 py-6 flex-1 w-full">

    <div th:replace="~{fragments.html :: flash-messages}"></div>

    <!-- Link de impressão gerado -->
    <div th:if="${urlImpressao != null}"
         class="mt-4 p-5 bg-green-50 border border-green-200 rounded-2xl flex items-center justify-between gap-4">
        <div>
            <p class="text-sm font-bold text-green-800" th:text="#{pedidos.imprimir.linkPronto}">Etiquetas prontas para impressão!</p>
            <p class="text-xs text-green-600 mt-1 break-all" th:text="${urlImpressao}"></p>
        </div>
        <a th:href="${urlImpressao}" target="_blank"
           class="shrink-0 px-5 py-2.5 bg-green-600 text-white text-sm font-bold rounded-xl hover:bg-green-700 transition"
           th:text="#{pedidos.imprimir.abrirLink}">Abrir / Imprimir</a>
    </div>

    <div class="bg-white p-6 mt-4 shadow-sm rounded-2xl">

        <div th:replace="~{fragments.html :: pedidos-page-header(#{pedidos.imprimir.titulo}, #{pedidos.imprimir.subtitulo})}"></div>

        <!-- Sem pedidos -->
        <div th:if="${pedidos == null or pedidos.isEmpty()}" class="text-center py-12 text-gray-400">
            <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                      d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
            </svg>
            <p class="font-medium" th:text="#{pedidos.imprimir.vazio}">Não há pedidos aguardando impressão de etiqueta.</p>
            <a th:href="@{/web/pedidos/etiquetas}"
               class="mt-4 inline-block px-4 py-2 bg-purple-600 text-white font-semibold rounded hover:bg-purple-700 transition text-sm"
               th:text="#{pedidos.acao.etiquetas}">Gerar Etiquetas</a>
        </div>

        <!-- Formulário -->
        <form th:if="${pedidos != null and !pedidos.isEmpty()}"
              th:action="@{/web/pedidos/imprimir}" method="post">

            <th:block th:replace="~{fragments.html :: pedidos-selecao-tabela}"></th:block>

            <div class="mt-6 flex gap-3 justify-end">
                <a th:href="@{/web/pedidos}"
                   class="px-4 py-2 border border-gray-300 text-gray-700 text-sm font-semibold rounded hover:bg-gray-100 transition"
                   th:text="#{common.cancelar}">Cancelar</a>
                <button type="submit"
                        class="px-6 py-2 bg-gray-700 text-white text-sm font-semibold rounded-xl hover:bg-gray-800 transition"
                        th:text="#{pedidos.imprimir.confirmar}">Gerar Link de Impressão</button>
            </div>
        </form>
    </div>

</div>

<div th:replace="~{fragments.html :: footer}"></div>
</div>
</body>
</html>
