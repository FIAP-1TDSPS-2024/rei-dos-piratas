<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — Rei dos Piratas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <th:block th:replace="~{fragments.html :: head-scripts}"></th:block>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex items-center justify-center">

<div class="w-full max-w-lg mx-auto p-4">

    <div class="text-center mb-6">
        <a href="/web/produtos" class="inline-flex items-center space-x-2 text-2xl font-bold text-gray-800">
            <span class="text-yellow-400 text-3xl">&#9678;</span>
            <span>Rei dos Piratas</span>
        </a>
        <p class="text-gray-500 mt-1 text-sm">Crie sua conta para comprar mang&aacute;s novos e usados.</p>
    </div>

    <div class="bg-white rounded-xl shadow-md p-8">

        <h2 class="text-xl font-bold text-gray-800 mb-6">Criar conta</h2>

        <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-md text-sm">
            <span id="errorText"></span>
        </div>

        <form id="cadastroForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4" autocomplete="on">

            <div class="sm:col-span-2">
                <label for="nome_completo" class="block text-sm font-medium text-gray-700 mb-1">Nome completo</label>
                <input type="text" id="nome_completo" name="nome_completo" required autocomplete="name" maxlength="255"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400">
            </div>

            <div>
                <label for="user_name" class="block text-sm font-medium text-gray-700 mb-1">Nome de usu&aacute;rio</label>
                <input type="text" id="user_name" name="user_name" required autocomplete="username" maxlength="100"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400"
                       placeholder="seu@email.com">
            </div>

            <div>
                <label for="senha" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" id="senha" name="senha" required autocomplete="new-password" data-dd-privacy="hidden"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400">
            </div>

            <div>
                <label for="confirmacao_senha" class="block text-sm font-medium text-gray-700 mb-1">Confirme a senha</label>
                <input type="password" id="confirmacao_senha" required autocomplete="new-password" data-dd-privacy="hidden"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400">
            </div>

            <div>
                <label for="cpf" class="block text-sm font-medium text-gray-700 mb-1">CPF</label>
                <input type="text" id="cpf" name="cpf" required inputmode="numeric" maxlength="14" data-dd-privacy="hidden"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400"
                       placeholder="Somente n&uacute;meros">
            </div>

            <div>
                <label for="celular" class="block text-sm font-medium text-gray-700 mb-1">Celular</label>
                <input type="tel" id="celular" name="celular" required autocomplete="tel-national" inputmode="numeric" maxlength="15"
                       data-dd-privacy="hidden"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400"
                       placeholder="DDD + n&uacute;mero">
            </div>

            <div>
                <label for="data_nascimento" class="block text-sm font-medium text-gray-700 mb-1">Data de nascimento</label>
                <input type="date" id="data_nascimento" name="data_nascimento" required autocomplete="bday"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400">
            </div>

            <div>
                <label for="sexo" class="block text-sm font-medium text-gray-700 mb-1">Sexo</label>
                <select id="sexo" name="sexo" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <option value="" selected disabled>Selecione</option>
                    <option value="F">Feminino</option>
                    <option value="M">Masculino</option>
                </select>
            </div>

            <button type="submit"
                    class="sm:col-span-2 w-full py-2 px-4 bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-semibold rounded-md transition">
                Criar conta
            </button>
        </form>

        <div class="mt-6 text-center text-sm space-y-2">
            <p>J&aacute; tem conta? <a href="/web/login" class="text-blue-700 hover:underline">Entrar</a></p>
            <a href="/web/produtos" class="text-gray-500 hover:text-gray-700">← Voltar para a loja</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const valor = nome => form.elements[nome].value.trim();
        if (form.elements.senha.value !== document.getElementById('confirmacao_senha').value) {
            showError('As senhas não conferem.');
            return;
        }
        const dados = {
            nome_completo: valor('nome_completo'),
            user_name: valor('user_name'),
            email: valor('email'),
            senha: form.elements.senha.value,
            cpf: valor('cpf').replace(/\D/g, ''),
            celular: valor('celular').replace(/\D/g, ''),
            data_nascimento: valor('data_nascimento'),
            sexo: valor('sexo')
        };
        const button = e.submitter;
        if (button) button.disabled = true;
        try {
            await window.webAuth.cadastrar(dados);
            window.location.href = '/web/produtos';
        } catch (err) {
            showError(err.message || 'Erro ao conectar. Tente novamente.');
        } finally {
            if (button) button.disabled = false;
        }
    });

    function showError(msg) {
        document.getElementById('errorText').textContent = msg;
        document.getElementById('errorMessage').classList.remove('hidden');
    }
</script>
</body>
</html>
