<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{produtos.page.title}">Produtos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">

<div th:replace="~{fragments.html :: navbar}"></div>

<!-- Hero banner -->
<div class="bg-gradient-to-r from-gray-900 via-gray-800 to-yellow-900 text-white">
    <div class="max-w-screen-2xl mx-auto px-4 py-8 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-black tracking-tight" th:text="#{produtos.lista}">Nossos Produtos</h1>
            <p class="text-gray-300 mt-1 text-sm" th:text="#{produtos.header.subtitle}">Confira os mangás disponíveis</p>
        </div>
        <a sec:authorize="hasRole('PRODUTO_WRITE')"
           th:href="@{/web/produtos/novo}"
           class="px-5 py-2.5 bg-yellow-400 text-gray-900 font-bold rounded-lg hover:bg-yellow-300 transition shadow-lg"
           th:text="#{produtos.novo}">Cadastrar Produto</a>
    </div>
</div>

<div class="max-w-screen-2xl mx-auto px-4 py-12 flex-1 w-full flex items-center justify-center">
    <div class="text-center">
        <div class="w-24 h-24 bg-white rounded-full shadow-sm flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
            </svg>
        </div>
        <p class="text-2xl font-bold text-gray-700 mb-2" th:text="#{produtos.lista.vazia}">Nenhum produto cadastrado</p>
        <p class="text-gray-400 mb-8 max-w-sm mx-auto" th:text="#{produtos.vazio.descricao}">
            Você ainda não possui produtos cadastrados no sistema.
        </p>
        <a sec:authorize="hasRole('PRODUTO_WRITE')"
           th:href="@{/web/produtos/novo}"
           class="px-6 py-3 bg-yellow-400 text-gray-900 font-bold rounded-xl hover:bg-yellow-500 transition shadow-sm text-sm"
           th:text="#{produtos.novo}">Cadastrar Primeiro Produto</a>
    </div>
</div>

<div th:replace="~{fragments.html :: footer}"></div>
</body>
</html>
