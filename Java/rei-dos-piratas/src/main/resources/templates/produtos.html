<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{produtos.page.title}">Produtos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">

<div th:replace="~{fragments.html :: navbar}"></div>

<!-- Hero banner -->
<div class="bg-gradient-to-r from-gray-900 via-gray-800 to-yellow-900 text-white">
    <div class="max-w-screen-2xl mx-auto px-4 py-8 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-black tracking-tight" th:text="#{produtos.lista}">Nossos Mangás</h1>
            <p class="text-gray-300 mt-1 text-sm" th:text="#{produtos.header.subtitle}">Complete sua coleção conosco!</p>
        </div>
        <a sec:authorize="hasRole('PRODUTO_WRITE')"
           th:href="@{/web/produtos/novo}"
           class="px-5 py-2.5 bg-yellow-400 text-gray-900 font-bold rounded-lg hover:bg-yellow-300 transition shadow-lg"
           th:text="#{produtos.novo}">Cadastrar Produto</a>
    </div>
</div>

<div class="max-w-screen-2xl mx-auto px-4 py-6 flex-1 w-full">

    <div th:replace="~{fragments.html :: flash-messages}"></div>

    <div class="flex gap-0">

        <!-- Main content -->
        <div class="flex-1 min-w-0">

            <!-- Count bar -->
            <div class="flex items-center justify-between mb-4">
                <p class="text-sm text-gray-500">
                    Exibindo <span class="font-semibold text-gray-800" th:text="${produtos.size()}">0</span> mangás
                    &nbsp;&mdash;&nbsp; Página
                    <span class="font-semibold text-gray-800" th:text="${pageNumber + 1}">1</span>
                    de <span class="font-semibold text-gray-800" th:text="${totalPages}">1</span>
                </p>
            </div>

            <!-- Product grid -->
            <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
                <div th:each="produto : ${produtos}"
                     class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow overflow-hidden flex flex-col group">

                    <!-- Product image -->
                    <a th:href="@{/web/produtos/{id}(id=${produto.id})}" class="block relative bg-gray-50 aspect-square overflow-hidden">
                        <img th:if="${produto.enderecoImagem != null and !#strings.isEmpty(produto.enderecoImagem)}"
                             th:src="${produto.enderecoImagem}" th:alt="${produto.nome}"
                             class="w-full h-full object-contain p-4 group-hover:scale-105 transition-transform duration-300"/>
                        <div th:unless="${produto.enderecoImagem != null and !#strings.isEmpty(produto.enderecoImagem)}"
                             class="w-full h-full flex flex-col items-center justify-center p-4">
                            <svg class="w-16 h-16 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                            </svg>
                            <span class="text-xs text-gray-300 mt-2">Sem imagem</span>
                        </div>
                        <!-- Category badge -->
                        <span class="absolute top-2 left-2 px-2 py-0.5 text-xs font-semibold bg-yellow-400 text-gray-900 rounded-md shadow-sm"
                              th:text="${produto.categoria}"></span>
                        <!-- Discount badge -->
                        <span th:if="${produto.precoOriginal != null and produto.precoOriginal != produto.preco}"
                              class="absolute top-2 right-2 px-2 py-0.5 text-xs font-bold bg-red-500 text-white rounded-md shadow-sm">
                            OFF
                        </span>
                    </a>

                    <!-- Product info -->
                    <div class="p-3 flex flex-col flex-1">
                        <h3 class="text-sm font-semibold text-gray-800 line-clamp-2 mb-1 leading-snug"
                            th:text="${produto.nome}">Nome do Produto</h3>

                        <p class="text-xs text-gray-400 mb-3" th:text="${produto.autor}">Autor</p>

                        <div class="mt-auto">
                            <!-- Strikethrough original price -->
                            <p th:if="${produto.precoOriginal != null and produto.precoOriginal != produto.preco}"
                               class="text-xs text-gray-400 line-through"
                               th:text="${'R$ ' + #numbers.formatDecimal(produto.precoOriginal, 1, 'POINT', 2, 'COMMA')}"></p>
                            <!-- Current price -->
                            <p class="text-lg font-black text-gray-900"
                               th:text="${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
                            <p class="text-xs text-green-600 font-medium">Em estoque: <span th:text="${produto.estoque}">0</span></p>
                        </div>

                        <a th:href="@{/web/produtos/{id}(id=${produto.id})}"
                           class="mt-3 block text-center text-sm font-semibold py-2 rounded-lg bg-yellow-400 hover:bg-yellow-500 text-gray-900 transition"
                           th:text="#{produtos.verDetalhes}">Ver Detalhes</a>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div th:if="${totalPages > 1}" class="mt-8 flex justify-center items-center gap-1">
                <a th:if="${pageNumber > 0}"
                   th:href="@{/web/produtos(pageNumber=0)}"
                   class="px-3 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 transition text-sm">«</a>
                <a th:if="${pageNumber > 0}"
                   th:href="@{/web/produtos(pageNumber=${pageNumber - 1})}"
                   class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 transition text-sm"
                   th:text="#{produtos.paginacao.anterior}">Anterior</a>
                <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:if="${i >= pageNumber - 2 and i <= pageNumber + 2}"
                       th:href="@{/web/produtos(pageNumber=${i})}"
                       th:text="${i + 1}"
                       th:classappend="${i == pageNumber} ? 'bg-yellow-400 text-gray-900 font-bold border-yellow-400' : 'border-gray-300 text-gray-600 hover:bg-gray-100'"
                       class="px-4 py-2 rounded-lg border transition text-sm">1</a>
                </th:block>
                <a th:if="${pageNumber + 1 < totalPages}"
                   th:href="@{/web/produtos(pageNumber=${pageNumber + 1})}"
                   class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 transition text-sm"
                   th:text="#{produtos.paginacao.proximo}">Próximo</a>
                <a th:if="${pageNumber + 1 < totalPages}"
                   th:href="@{/web/produtos(pageNumber=${totalPages - 1})}"
                   class="px-3 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 transition text-sm">»</a>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments.html :: footer}"></div></body>
</html>
