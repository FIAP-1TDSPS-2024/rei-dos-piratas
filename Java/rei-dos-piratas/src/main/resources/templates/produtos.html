<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{produtos.page.title}">Produtos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
<div class="max-w-4xl mx-auto p-4">

    <div th:replace="~{fragments.html :: navbar}"></div>

    <!-- Mensagens flash -->
    <div th:if="${successMessage}" class="mt-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-md text-sm"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="mt-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-md text-sm"
         th:text="${errorMessage}"></div>

    <div class="bg-white p-4 mt-4 shadow-md rounded-md">
        <!-- Título da página -->
        <div class="mb-6 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-gray-800" th:text="#{produtos.lista}"></h1>
                <p class="text-gray-500" th:text="#{produtos.header.subtitle}">Confira os produtos disponíveis</p>
            </div>
            <!-- Botão Cadastrar apenas para funcionários com permissão -->
            <a sec:authorize="hasRole('PRODUTO_WRITE')"
               th:href="@{/web/produtos/novo}"
               class="px-4 py-2 bg-yellow-400 text-gray-900 font-semibold rounded hover:bg-yellow-500 transition"
               th:text="#{produtos.novo}">Cadastrar Produto</a>
        </div>

        <!-- Listagem de produtos -->
        <div>
            <ul class="grid grid-cols-3 gap-4">
                <li th:each="produto : ${produtos}">
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 hover:shadow-lg transition-shadow">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-gray-800" th:text="${produto.nome}">Nome</h3>
                            <span class="px-2 py-1 text-xs font-semibold bg-green-100 text-green-700 rounded"
                                  th:text="${produto.categoria}">ACAO</span>
                        </div>
                        <p class="text-gray-500 text-sm mb-4 line-clamp-2" th:text="${produto.descricao}">
                            Descrição do produto.
                        </p>
                        <div class="flex justify-between items-center">
                            <span class="text-lg font-bold text-gray-900"
                                  th:text="${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span>
                            <a th:href="@{/web/produtos/{id}(id=${produto.id})}"
                               class="px-3 py-1.5 text-sm border border-gray-400 rounded hover:bg-gray-200 transition"
                               th:text="#{produtos.verDetalhes}">Ver Detalhes</a>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>

</div>
</body>
</html>
