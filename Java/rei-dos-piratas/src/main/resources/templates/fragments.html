<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Fragments</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<!-- ===================== NAVBAR ===================== -->
<nav th:fragment="navbar" class="bg-gray-800 text-white rounded-md">
    <div class="flex justify-between items-center px-4 py-3">
        <!-- Logo -->
        <a th:href="@{/web/produtos}" class="flex items-center space-x-2 font-bold text-lg">
            <span class="text-yellow-400">&#9678;</span>
            <span>Rei dos Piratas</span>
        </a>

        <!-- Links de navega&ccedil;&atilde;o -->
        <div class="flex items-center space-x-6">
            <a th:href="@{/web/produtos}" class="hover:text-yellow-400 transition">Produtos</a>
            <a sec:authorize="hasRole('PRODUTO_WRITE')"
               th:href="@{/web/produtos/novo}"
               class="hover:text-yellow-400 transition">Cadastrar</a>
            <a sec:authorize="hasRole('PEDIDO_WRITE')"
               th:href="@{/web/pedidos}"
               class="hover:text-yellow-400 transition">Pedidos</a>
        </div>

        <!-- Usu&aacute;rio autenticado -->
        <div sec:authorize="isAuthenticated()" class="relative group">
            <button class="flex items-center space-x-2 px-3 py-1.5 border border-gray-500 rounded-md hover:bg-gray-700 transition">
                <img src="https://ui-avatars.com/api/?name=User&background=ffc107&color=000&size=28"
                     class="rounded-full w-7 h-7" alt="Avatar">
                <span class="text-sm" sec:authentication="name">Usu&aacute;rio</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
            </button>
            <!-- Dropdown de a&ccedil;&otilde;es do usu&aacute;rio -->
            <div class="absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-md shadow-lg hidden group-hover:block z-50">
                <!-- Logout: invalida o token no servidor e apaga o cookie -->
                <form th:action="@{/web/logout}" method="post" style="margin:0">
                    <button type="submit"
                            class="w-full text-left block px-4 py-2 text-red-500 hover:bg-gray-100">
                        Sair
                    </button>
                </form>
            </div>
        </div>

        <!-- Bot&atilde;o Entrar (n&atilde;o autenticado) -->
        <div sec:authorize="!isAuthenticated()">
            <a th:href="@{/web/login}"
               class="px-3 py-1.5 border border-gray-500 rounded-md hover:bg-gray-700 transition text-sm">
                Entrar
            </a>
        </div>
    </div>
</nav>

<!-- ===================== FOOTER ===================== -->
<footer th:fragment="footer" class="bg-gray-800 text-gray-400 text-center py-4 rounded-md mt-4">
    <small>&copy; 2026 Rei dos Piratas &mdash; FIAP. Todos os direitos reservados.</small>
</footer>

<!-- ===================== FLASH MESSAGES ===================== -->
<div th:fragment="flash-messages">
    <div th:if="${successMessage}" class="mt-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-md text-sm"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="mt-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-md text-sm"
         th:text="${errorMessage}"></div>
    <div th:if="${warningMessage}" class="mt-4 p-3 bg-yellow-50 border border-yellow-200 text-yellow-700 rounded-md text-sm"
         th:text="${warningMessage}"></div>
</div>

<!-- ===================== STATUS BADGE (uso: th:replace com status via model) ===================== -->
<!--
    Uso: <span th:replace="~{fragments.html :: status-badge(${pedido.status.name()})}"></span>
-->
<span th:fragment="status-badge(statusName)"
      th:text="${statusName}"
      th:classappend="${statusName == 'PREPARANDO_ENVIO'} ? 'bg-blue-100 text-blue-700' :
                      (${statusName == 'AGUARDANDO_PAGAMENTO'} ? 'bg-yellow-100 text-yellow-700' :
                      (${statusName == 'AGUARDANDO_POSTAGEM'} ? 'bg-orange-100 text-orange-700' :
                      (${statusName == 'EM_TRANSITO'} ? 'bg-indigo-100 text-indigo-700' :
                      (${statusName == 'ENTREGUE'} ? 'bg-green-100 text-green-700' :
                      (${statusName == 'CANCELADO'} ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700')))))"
      class="px-2 py-1 text-xs font-semibold rounded-full"></span>

<!-- ===================== PEDIDOS: TABELA DE SELEÇÃO COM CHECKBOX ===================== -->
<!--
    Uso: <th:block th:replace="~{fragments.html :: pedidos-selecao-tabela}"></th:block>
    Requer no model: ${pedidos} (lista de pedidos)
-->
<th:block th:fragment="pedidos-selecao-tabela">
    <!-- Barra de seleção -->
    <div class="mb-3 flex items-center justify-between">
        <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
            <input type="checkbox" id="selectAll" class="rounded"
                   onclick="document.querySelectorAll('.pedido-check').forEach(c => c.checked = this.checked)">
            Selecionar todos
        </label>
        <span class="text-xs text-gray-400"
              th:text="${pedidos.size() + ' pedido(s) disponível(is)'}"></span>
    </div>

    <table class="w-full text-sm text-left border-collapse">
        <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
        <tr>
            <th class="px-4 py-3 border-b w-10"></th>
            <th class="px-4 py-3 border-b">#ID</th>
            <th class="px-4 py-3 border-b" th:text="#{pedidos.col.data}">Data</th>
            <th class="px-4 py-3 border-b" th:text="#{pedidos.col.itens}">Itens</th>
            <th class="px-4 py-3 border-b" th:text="#{pedidos.col.total}">Total</th>
            <th class="px-4 py-3 border-b" th:text="#{pedidos.col.previsao}">Previsão</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pedido : ${pedidos}" class="hover:bg-gray-50 border-b">
            <td class="px-4 py-3">
                <input type="checkbox" name="pedidosSelecionados"
                       th:value="${pedido.id}"
                       class="pedido-check rounded">
            </td>
            <td class="px-4 py-3 font-mono text-gray-500" th:text="${'#' + pedido.id}"></td>
            <td class="px-4 py-3" th:text="${pedido.dataPedido}"></td>
            <td class="px-4 py-3 text-center" th:text="${pedido.produtosAdicionados.size()}"></td>
            <td class="px-4 py-3 font-semibold"
                th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="px-4 py-3 text-gray-500"
                th:text="${pedido.previsaoEntrega != null ? pedido.previsaoEntrega : '-'}"></td>
        </tr>
        </tbody>
    </table>
</th:block>

<!-- ===================== PEDIDOS: ESTADO VAZIO (clipboard) ===================== -->
<div th:fragment="pedidos-vazio-clipboard(mensagem, linkHref, linkTexto)"
     class="text-center py-12 text-gray-400">
    <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
    </svg>
    <p class="font-medium" th:text="${mensagem}">Nenhum pedido encontrado.</p>
    <a th:href="${linkHref}"
       class="mt-4 inline-block px-4 py-2 bg-yellow-400 text-gray-900 font-semibold rounded hover:bg-yellow-500 transition text-sm"
       th:text="${linkTexto}">Voltar</a>
</div>

<!-- ===================== PEDIDOS: CABEÇALHO DE PÁGINA ===================== -->
<div th:fragment="pedidos-page-header(titulo, subtitulo)"
     class="mb-6">
    <a th:href="@{/web/pedidos}" class="text-gray-400 text-sm hover:text-gray-600">← Voltar para Pedidos</a>
    <h1 class="text-2xl font-bold text-gray-800 mt-1" th:text="${titulo}">Título</h1>
    <p class="text-gray-500 text-sm mt-1" th:text="${subtitulo}"></p>
</div>

</body>
</html>
