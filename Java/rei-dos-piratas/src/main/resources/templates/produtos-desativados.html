<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos desativados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <th:block th:replace="~{fragments.html :: head-scripts}"></th:block>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">

<div th:replace="~{fragments.html :: navbar}"></div>

<main class="max-w-screen-lg w-full mx-auto px-4 py-8 flex-1 space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-2">
        <div>
            <h1 class="text-2xl font-black">Produtos desativados</h1>
            <p class="text-sm text-gray-500">Fora da loja. Os pedidos que já os têm continuam iguais.</p>
        </div>
        <a th:href="@{/web/produtos}" class="text-sm text-blue-700">← Voltar para a loja</a>
    </div>
    <div th:replace="~{fragments.html :: flash-messages}"></div>

    <p th:if="${#lists.isEmpty(produtos)}" class="bg-white rounded-xl shadow p-6 text-center text-gray-500">
        Nenhum produto desativado.</p>

    <ul th:unless="${#lists.isEmpty(produtos)}" class="bg-white rounded-xl shadow divide-y">
        <li th:each="produto : ${produtos}" class="p-4 flex items-center gap-4">
            <div class="w-14 h-20 shrink-0 rounded bg-gray-100 overflow-hidden flex items-center justify-center">
                <img th:if="${produto.urlImagem != null}" th:src="${produto.urlImagem}" th:alt="${produto.nome}"
                     class="w-full h-full object-cover opacity-60">
                <span th:unless="${produto.urlImagem != null}" class="text-xs text-gray-400">Sem imagem</span>
            </div>
            <div class="flex-1 min-w-0">
                <a th:href="@{/web/produtos/{id}(id=${produto.id})}" class="font-semibold text-gray-800 hover:underline"
                   th:text="${produto.nome}">Produto</a>
                <p class="text-xs text-gray-500"
                   th:text="${produto.autor + ' · estoque ' + produto.estoque + ' · R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">
                    Autor · estoque 0 · R$ 0,00</p>
            </div>
            <form th:action="@{/web/produtos/{id}/reativar(id=${produto.id})}" method="post">
                <button type="submit" class="px-4 py-2 bg-green-600 text-white text-sm font-bold rounded-xl hover:bg-green-700">
                    Reativar</button>
            </form>
        </li>
    </ul>

    <div th:if="${totalPages > 1}" class="flex justify-center gap-2 text-sm">
        <a th:if="${pageNumber > 0}" th:href="@{/web/produtos/desativados(pageNumber=${pageNumber - 1})}"
           class="px-3 py-1 border rounded bg-white">← Anterior</a>
        <span class="px-3 py-1" th:text="${(pageNumber + 1) + ' de ' + totalPages}">1 de 1</span>
        <a th:if="${pageNumber + 1 < totalPages}" th:href="@{/web/produtos/desativados(pageNumber=${pageNumber + 1})}"
           class="px-3 py-1 border rounded bg-white">Próxima →</a>
    </div>
</main>

<div th:replace="~{fragments.html :: footer}"></div>
</body>
</html>
