<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{pedido.detalhes.page.title}">Detalhes do Pedido</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
<div class="max-w-4xl mx-auto p-4">

    <div th:replace="~{fragments.html :: navbar}"></div>

    <!-- Mensagens flash -->
    <div th:if="${successMessage}" class="mt-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-md text-sm"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="mt-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-md text-sm"
         th:text="${errorMessage}"></div>

    <div class="bg-white p-6 mt-4 shadow-md rounded-md">

        <!-- Cabeçalho -->
        <div class="flex justify-between items-start mb-6">
            <div>
                <p class="text-gray-400 text-sm" th:text="#{pedido.detalhes.breadcrumb}">Pedidos</p>
                <h1 class="text-2xl font-bold text-gray-800"
                    th:text="${'Pedido #' + pedido.id}">Pedido</h1>
                <p class="text-sm text-gray-500 mt-1"
                   th:text="${'Realizado em: ' + pedido.dataPedido}"></p>
            </div>
            <div class="text-right">
                <span th:text="${pedido.status.name()}"
                      th:classappend="${pedido.status.name() == 'PREPARANDO_ENVIO'} ? 'bg-blue-100 text-blue-700' :
                                      (${pedido.status.name() == 'AGUARDANDO_PAGAMENTO'} ? 'bg-yellow-100 text-yellow-700' :
                                      (${pedido.status.name() == 'EM_TRANSITO'} ? 'bg-indigo-100 text-indigo-700' :
                                      (${pedido.status.name() == 'ENTREGUE'} ? 'bg-green-100 text-green-700' :
                                      (${pedido.status.name() == 'CANCELADO'} ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700'))))"
                      class="px-3 py-1 text-sm font-semibold rounded-full"></span>
            </div>
        </div>

        <!-- Informações gerais -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-gray-50 p-4 rounded-lg">
                <p class="text-xs text-gray-400 uppercase font-semibold mb-1" th:text="#{pedido.detalhes.valorTotal}">Valor Total</p>
                <p class="text-xl font-bold text-gray-800"
                   th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</p>
            </div>
            <div class="bg-gray-50 p-4 rounded-lg">
                <p class="text-xs text-gray-400 uppercase font-semibold mb-1" th:text="#{pedido.detalhes.valorFrete}">Frete</p>
                <p class="text-xl font-bold text-gray-800"
                   th:text="${pedido.valorFrete != null ? 'R$ ' + #numbers.formatDecimal(pedido.valorFrete, 1, 'POINT', 2, 'COMMA') : '-'}">R$ 0,00</p>
            </div>
            <div class="bg-gray-50 p-4 rounded-lg">
                <p class="text-xs text-gray-400 uppercase font-semibold mb-1" th:text="#{pedido.detalhes.previsao}">Previsão de Entrega</p>
                <p class="text-lg font-bold text-gray-800"
                   th:text="${pedido.previsaoEntrega != null ? pedido.previsaoEntrega : '-'}"></p>
            </div>
        </div>

        <!-- Produtos do pedido -->
        <div class="mb-6">
            <h2 class="text-sm uppercase text-gray-500 font-semibold mb-3" th:text="#{pedido.detalhes.produtos}">Produtos</h2>
            <div class="border rounded-lg overflow-hidden">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
                    <tr>
                        <th class="px-4 py-3 text-left" th:text="#{pedido.detalhes.col.produto}">Produto</th>
                        <th class="px-4 py-3 text-center" th:text="#{pedido.detalhes.col.quantidade}">Qtd</th>
                        <th class="px-4 py-3 text-right" th:text="#{pedido.detalhes.col.precoUnitario}">Preço Unit.</th>
                        <th class="px-4 py-3 text-right" th:text="#{pedido.detalhes.col.subtotal}">Subtotal</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${pedido.produtosAdicionados}" class="border-t">
                        <td class="px-4 py-3 font-medium" th:text="${item.produto.nome}"></td>
                        <td class="px-4 py-3 text-center" th:text="${item.quantidade}"></td>
                        <td class="px-4 py-3 text-right"
                            th:text="${'R$ ' + #numbers.formatDecimal(item.produto.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td class="px-4 py-3 text-right font-semibold"
                            th:text="${'R$ ' + #numbers.formatDecimal(item.produto.preco.multiply(T(java.math.BigDecimal).valueOf(item.quantidade)), 1, 'POINT', 2, 'COMMA')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Ações do funcionário -->
        <div sec:authorize="hasRole('PEDIDO_WRITE')" class="border-t pt-4 flex flex-wrap gap-2">
            <h3 class="w-full text-sm uppercase text-gray-500 font-semibold mb-2" th:text="#{pedido.detalhes.acoes}">Ações</h3>

            <!-- Enviar pedido: AGUARDANDO_POSTAGEM -->
            <form th:if="${pedido.status.name() == 'AGUARDANDO_POSTAGEM'}"
                  th:action="@{/web/pedidos/{id}/enviar(id=${pedido.id})}" method="post" style="margin:0">
                <button type="submit"
                        class="px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded hover:bg-indigo-700 transition"
                        th:text="#{pedidos.acao.enviar}">Marcar como Enviado</button>
            </form>

            <!-- Entregar pedido: EM_TRANSITO -->
            <form th:if="${pedido.status.name() == 'EM_TRANSITO'}"
                  th:action="@{/web/pedidos/{id}/entregar(id=${pedido.id})}" method="post" style="margin:0">
                <button type="submit"
                        class="px-4 py-2 bg-green-600 text-white text-sm font-semibold rounded hover:bg-green-700 transition"
                        th:text="#{pedidos.acao.entregar}">Confirmar Entrega</button>
            </form>

            <!-- Cancelar: pedidos em estados anteriores ao envio -->
            <form th:if="${pedido.status.name() != 'CANCELADO' and pedido.status.name() != 'ENTREGUE' and pedido.status.name() != 'EM_TRANSITO'}"
                  th:action="@{/web/pedidos/{id}/cancelar(id=${pedido.id})}" method="post" style="margin:0">
                <button type="submit"
                        onclick="return confirm('Confirma o cancelamento do pedido?')"
                        class="px-4 py-2 bg-red-600 text-white text-sm font-semibold rounded hover:bg-red-700 transition"
                        th:text="#{pedidos.acao.cancelar}">Cancelar Pedido</button>
            </form>

            <a th:href="@{/web/pedidos}"
               class="px-4 py-2 border border-gray-300 text-gray-700 text-sm font-semibold rounded hover:bg-gray-100 transition"
               th:text="#{common.voltar}">Voltar</a>
        </div>
    </div>

    <div th:replace="~{fragments.html :: footer}"></div>
</div>
</body>
</html>
