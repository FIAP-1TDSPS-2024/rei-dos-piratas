<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:if="${produto.id != null}"  th:text="#{produto.form.editar.page.title}">Editar Produto</title>
    <title th:unless="${produto.id != null}" th:text="#{produto.form.novo.page.title}">Novo Produto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <th:block th:replace="~{fragments.html :: head-scripts}"></th:block>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">

<div th:replace="~{fragments.html :: navbar}"></div>

<div class="max-w-screen-2xl mx-auto px-4 py-6 flex-1 w-full">
    <div class="max-w-3xl mx-auto">
    <div class="bg-white p-8 shadow-sm rounded-2xl">

        <!-- Breadcrumb -->
        <nav class="mb-6">
            <ol class="flex items-center space-x-2 text-sm">
                <li>
                    <a href="/web/produtos" class="text-gray-500 hover:text-gray-700" th:text="#{produto.detalhes.breadcrumb}">Produtos</a>
                </li>
                <li class="text-gray-400">/</li>
                <li class="text-gray-800 font-medium">
                    <span th:if="${produto.id != null}"  th:text="#{produto.form.editar.page.title}">Editar Produto</span>
                    <span th:unless="${produto.id != null}" th:text="#{produto.form.breadcrumb.novo}">Novo Produto</span>
                </li>
            </ol>
        </nav>

        <!-- T&iacute;tulo -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">
                <span th:if="${produto.id != null}"  th:text="#{produto.form.editar.page.title}">Editar Produto</span>
                <span th:unless="${produto.id != null}" th:text="#{produto.form.novo.page.title}">Novo Produto</span>
            </h1>
            <p class="text-gray-500" th:text="#{produto.form.subtitulo}">Preencha as informa&ccedil;&otilde;es do produto</p>
        </div>

        <!-- Erros de valida&ccedil;&atilde;o vindos da entidade de dom&iacute;nio -->
        <div th:if="${errosValidacao != null and !#maps.isEmpty(errosValidacao)}"
             class="mb-6 p-4 bg-red-50 border border-red-200 rounded-md">
            <p class="text-red-700 font-semibold mb-2">Corrija os erros abaixo:</p>
            <ul class="list-disc list-inside space-y-1">
                <li th:each="erro : ${errosValidacao}"
                    class="text-red-600 text-sm"
                    th:text="${erro.value}"></li>
            </ul>
        </div>

        <!-- Erro geral inesperado -->
        <div th:if="${erroGeral != null}"
             class="mb-6 p-4 bg-red-50 border border-red-200 rounded-md text-red-700 text-sm"
             th:text="${erroGeral}"></div>

        <!-- Formul&aacute;rio -->
        <form th:action="@{/web/produtos/save}" method="post" th:object="${produto}" class="space-y-6">
            <input type="hidden" th:field="*{id}">

            <!-- Nome do Produto -->
            <div>
                <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">
                    <span th:text="#{produto.form.nome}">Nome do Produto</span> <span class="text-red-500">*</span>
                </label>
                <input type="text" id="nome" name="nome" required
                       th:field="*{nome}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition"
                       th:placeholder="#{produto.form.placeholder.nome}">
            </div>

            <!-- Descri&ccedil;&atilde;o -->
            <div>
                <label for="descricao" class="block text-sm font-medium text-gray-700 mb-1">
                    <span th:text="#{produto.form.descricao}">Descri&ccedil;&atilde;o</span> <span class="text-red-500">*</span>
                </label>
                <textarea id="descricao" name="descricao" rows="4" required
                          th:field="*{descricao}"
                          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition resize-none"
                          th:placeholder="#{produto.form.placeholder.descricao}"></textarea>
            </div>

            <!-- Pre&ccedil;o e Categoria (lado a lado) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Pre&ccedil;o -->
                <div>
                    <label for="preco" class="block text-sm font-medium text-gray-700 mb-1">
                        <span th:text="#{produto.form.preco}">Pre&ccedil;o</span> <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">R$</span>
                        <input type="number" id="preco" name="preco" step="0.01" min="0" required
                               th:field="*{preco}"
                               class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition"
                               th:placeholder="#{produto.form.placeholder.preco}">
                    </div>
                </div>

                <!-- Categoria -->
                <div>
                    <label for="categoria" class="block text-sm font-medium text-gray-700 mb-1">
                        <span th:text="#{produto.form.categoria}">Categoria</span> <span class="text-red-500">*</span>
                    </label>
                    <select id="categoria" name="categoria" required
                            th:field="*{categoria}"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition bg-white">
                        <option value="" disabled th:text="#{produto.form.placeholder.categoria}">Selecione uma categoria</option>
                        <option th:each="cat : ${T(br.com.fiap.rei_dos_piratas.domain.Enum.CategoriaEnum).values()}"
                                th:value="${cat}" th:text="${cat.name()}">Categoria</option>
                    </select>
                </div>

            </div>

            <!-- Autor -->
            <div>
                <label for="autor" class="block text-sm font-medium text-gray-700 mb-1">Autor <span class="text-red-500">*</span></label>
                <input type="text" id="autor" name="autor" required
                       th:field="*{autor}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition"
                       placeholder="Nome do autor">
            </div>

            <!-- URL da Imagem -->
            <div>
                <label for="enderecoImagem" class="block text-sm font-medium text-gray-700 mb-1">URL da Imagem</label>
                <input type="text" id="enderecoImagem" name="enderecoImagem"
                       th:field="*{enderecoImagem}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition"
                       placeholder="http://...">
            </div>

            <!-- Pre&ccedil;o Original e Estoque -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="precoOriginal" class="block text-sm font-medium text-gray-700 mb-1">Pre&ccedil;o Original</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500">R$</span>
                        <input type="number" id="precoOriginal" name="precoOriginal" step="0.01" min="0"
                               th:field="*{precoOriginal}"
                               class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition"
                               placeholder="0,00">
                    </div>
                </div>
                <div>
                    <label for="estoque" class="block text-sm font-medium text-gray-700 mb-1">Estoque <span class="text-red-500">*</span></label>
                    <input type="number" id="estoque" name="estoque" min="0" required
                           th:field="*{estoque}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition"
                           placeholder="0">
                </div>
            </div>

            <!-- Condi&ccedil;&atilde;o -->
            <div>
                <label for="condicao" class="block text-sm font-medium text-gray-700 mb-1">Condi&ccedil;&atilde;o <span class="text-red-500">*</span></label>
                <select id="condicao" name="condicao" required
                        th:field="*{condicao}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition bg-white">
                    <option value="" disabled>Selecione a condi&ccedil;&atilde;o</option>
                    <option th:each="cond : ${T(br.com.fiap.rei_dos_piratas.domain.Enum.CondicaoEnum).values()}"
                            th:value="${cond}" th:text="${cond.name()}">Condi&ccedil;&atilde;o</option>
                </select>
            </div>

            <!-- Dimens&otilde;es -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div>
                    <label for="altura" class="block text-sm font-medium text-gray-700 mb-1">Altura (cm)</label>
                    <input type="number" id="altura" name="altura" step="0.01" min="0"
                           th:field="*{altura}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 transition">
                </div>
                <div>
                    <label for="largura" class="block text-sm font-medium text-gray-700 mb-1">Largura (cm)</label>
                    <input type="number" id="largura" name="largura" step="0.01" min="0"
                           th:field="*{largura}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 transition">
                </div>
                <div>
                    <label for="profundidade" class="block text-sm font-medium text-gray-700 mb-1">Prof. (cm)</label>
                    <input type="number" id="profundidade" name="profundidade" step="0.01" min="0"
                           th:field="*{profundidade}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 transition">
                </div>
                <div>
                    <label for="peso" class="block text-sm font-medium text-gray-700 mb-1">Peso (kg)</label>
                    <input type="number" id="peso" name="peso" step="0.01" min="0"
                           th:field="*{peso}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 transition">
                </div>
            </div>

            <!-- Mensagem de erro (oculto por padr&atilde;o) -->
            <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-md">
                <div class="flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span th:text="#{produto.form.erro.obrigatorio}">Por favor, preencha todos os campos obrigat&oacute;rios.</span>
                </div>
            </div>

            <!-- Bot&otilde;es de a&ccedil;&atilde;o -->
            <div class="flex flex-wrap gap-3 pt-4 border-t border-gray-200">
                <button type="submit" th:if="${produto.id != null}"
                        class="px-6 py-2 bg-yellow-400 text-gray-900 font-semibold rounded hover:bg-yellow-500 transition"
                        th:text="#{produto.form.atualizar}">Atualizar Produto</button>
                <button type="submit" th:unless="${produto.id != null}"
                        class="px-6 py-2 bg-yellow-400 text-gray-900 font-semibold rounded hover:bg-yellow-500 transition"
                        th:text="#{produto.form.salvar}">Salvar Produto</button>
                <a th:href="@{/web/produtos}"
                   class="px-6 py-2 border border-gray-400 text-gray-700 rounded hover:bg-gray-100 transition"
                   th:text="#{common.cancelar}">Cancelar</a>
            </div>

        </form>

    </div>
    </div>
</div>

<div th:replace="~{fragments.html :: footer}"></div>
</body>
</html>
