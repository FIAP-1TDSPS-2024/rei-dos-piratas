<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{pedidos.etiquetas.page.title}">Gerar Etiquetas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
<div class="max-w-5xl mx-auto p-4">

    <div th:replace="~{fragments.html :: navbar}"></div>

    <!-- Mensagens flash -->
    <div th:if="${successMessage}" class="mt-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-md text-sm"
         th:text="${successMessage}"></div>
    <div th:if="${warningMessage}" class="mt-4 p-3 bg-yellow-50 border border-yellow-200 text-yellow-700 rounded-md text-sm"
         th:text="${warningMessage}"></div>
    <div th:if="${errorMessage}" class="mt-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-md text-sm"
         th:text="${errorMessage}"></div>

    <!-- Resultado da geração de etiquetas -->
    <div th:if="${resultadoEtiquetas != null and !resultadoEtiquetas.isEmpty()}"
         class="mt-4 p-4 bg-blue-50 border border-blue-200 rounded-md">
        <h3 class="text-sm font-semibold text-blue-800 mb-2" th:text="#{pedidos.etiquetas.resultado}">Resultado da Geração</h3>
        <ul class="text-sm space-y-1">
            <li th:each="entry : ${resultadoEtiquetas}"
                th:classappend="${entry.value.startsWith('Etiqueta gerada')} ? 'text-green-700' : 'text-red-600'"
                th:text="${'Pedido #' + entry.key + ': ' + entry.value}"></li>
        </ul>
    </div>

    <div class="bg-white p-6 mt-4 shadow-md rounded-md">
        <div class="mb-6">
            <a th:href="@{/web/pedidos}" class="text-gray-400 text-sm hover:text-gray-600">← Voltar para Pedidos</a>
            <h1 class="text-2xl font-bold text-gray-800 mt-1" th:text="#{pedidos.etiquetas.titulo}">Gerar Etiquetas de Envio</h1>
            <p class="text-gray-500 text-sm mt-1" th:text="#{pedidos.etiquetas.subtitulo}">
                Selecione os pedidos organizados para gerar as etiquetas de envio.
            </p>
        </div>

        <!-- Sem pedidos -->
        <div th:if="${pedidos == null or pedidos.isEmpty()}" class="text-center py-12 text-gray-400">
            <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                      d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
            </svg>
            <p class="font-medium" th:text="#{pedidos.etiquetas.vazio}">Não há pedidos aguardando geração de etiqueta.</p>
            <a th:href="@{/web/pedidos/organizar}"
               class="mt-4 inline-block px-4 py-2 bg-blue-600 text-white font-semibold rounded hover:bg-blue-700 transition text-sm"
               th:text="#{pedidos.acao.organizar}">Organizar Pedidos</a>
        </div>

        <!-- Formulário -->
        <form th:if="${pedidos != null and !pedidos.isEmpty()}"
              th:action="@{/web/pedidos/etiquetas/gerar}" method="post">

            <div class="mb-3 flex items-center justify-between">
                <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                    <input type="checkbox" id="selectAll" class="rounded"
                           onclick="document.querySelectorAll('.pedido-check').forEach(c => c.checked = this.checked)">
                    Selecionar todos
                </label>
                <span class="text-xs text-gray-400"
                      th:text="${pedidos.size() + ' pedido(s) disponível(is)'}"></span>
            </div>

            <table class="w-full text-sm text-left border-collapse">
                <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
                <tr>
                    <th class="px-4 py-3 border-b w-10"></th>
                    <th class="px-4 py-3 border-b">#ID</th>
                    <th class="px-4 py-3 border-b" th:text="#{pedidos.col.data}">Data</th>
                    <th class="px-4 py-3 border-b" th:text="#{pedidos.col.itens}">Itens</th>
                    <th class="px-4 py-3 border-b" th:text="#{pedidos.col.total}">Total</th>
                    <th class="px-4 py-3 border-b" th:text="#{pedidos.col.previsao}">Previsão</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pedido : ${pedidos}" class="hover:bg-gray-50 border-b">
                    <td class="px-4 py-3">
                        <input type="checkbox" name="pedidosSelecionados"
                               th:value="${pedido.id}"
                               class="pedido-check rounded">
                    </td>
                    <td class="px-4 py-3 font-mono text-gray-500" th:text="${'#' + pedido.id}"></td>
                    <td class="px-4 py-3" th:text="${pedido.dataPedido}"></td>
                    <td class="px-4 py-3 text-center" th:text="${pedido.produtosAdicionados.size()}"></td>
                    <td class="px-4 py-3 font-semibold"
                        th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td class="px-4 py-3 text-gray-500"
                        th:text="${pedido.previsaoEntrega != null ? pedido.previsaoEntrega : '-'}"></td>
                </tr>
                </tbody>
            </table>

            <div class="mt-6 flex gap-3 justify-end">
                <a th:href="@{/web/pedidos}"
                   class="px-4 py-2 border border-gray-300 text-gray-700 text-sm font-semibold rounded hover:bg-gray-100 transition"
                   th:text="#{common.cancelar}">Cancelar</a>
                <button type="submit"
                        class="px-6 py-2 bg-purple-600 text-white text-sm font-semibold rounded hover:bg-purple-700 transition"
                        th:text="#{pedidos.etiquetas.confirmar}">Gerar Etiquetas</button>
            </div>
        </form>
    </div>

    <div th:replace="~{fragments.html :: footer}"></div>
</div>
</body>
</html>
