spring.application.name=rei-dos-piratas
server.port=8080

#Database
spring.profiles.active=prod
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Seguran�a do Banco e Logs
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# A trava do Hikari
spring.datasource.hikari.maximum-pool-size=3

# Flyway
spring.flyway.encoding=UTF-8
spring.flyway.sql-migration-suffixes=.sql,.SQL
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db.migracao
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Sem valor padrao: a aplicacao nao sobe sem JWT_SECRET (evita assinar tokens com chave publica no repositorio)
jwt.secret=${JWT_SECRET}
jwt.expiration= ${JWT_EXPIRATION:900000}

# N�veis de log definidos no logback-spring.xml (com suporte a JSON para Datadog APM)

# Feign Client Configuration
spring.cloud.openfeign.client.config.default.connect-timeout=30000
spring.cloud.openfeign.client.config.default.read-timeout=30000
spring.cloud.openfeign.client.config.default.logger-level=basic
spring.cloud.openfeign.client.config.default.default-request-headers.accept=application/json
spring.cloud.openfeign.client.config.default.default-request-headers.content-type=application/json

# Defini��o Feign Client para API de frete Melhor Envio
spring.cloud.openfeign.client.config.frete-app.default-request-headers.user-agent=jonas.joliveira2024@gmail.com
spring.cloud.openfeign.client.config.frete-token.default-request-headers.user-agent=jonas.joliveira2024@gmail.com

# Com contextId diferentes, definir URL por cliente evita fallback para load-balancer
spring.cloud.openfeign.client.config.frete-app.url=${ME_URL}
spring.cloud.openfeign.client.config.frete-token.url=${ME_URL}

# Defini��o Feign Client para API de pagamento Asaas
spring.cloud.openfeign.client.config.cobranca-app.url=${COBRANCA_URL}
spring.cloud.openfeign.client.config.cobranca-app.default-request-headers.access-token=${COBRANCA_API_KEY}

spring.jackson.property-naming-strategy: SNAKE_CASE

# Amazon SQS - eventos de cobranca do Asaas (listener so e criado com SQS_ENABLED=true)
aws.sqs.enabled=${SQS_ENABLED:false}
aws.sqs.queue-name=${SQS_QUEUE_NAME:}
spring.cloud.aws.region.static=${AWS_REGION:sa-east-1}
# Credenciais: usa a cadeia padrao da AWS (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, IAM role, etc.)
# Para LocalStack, defina spring.cloud.aws.sqs.endpoint (ex.: http://localhost:4566) via variavel de ambiente
spring.cloud.aws.sqs.listener.max-concurrent-messages=${SQS_MAX_CONCURRENT_MESSAGES:5}
spring.cloud.aws.sqs.listener.max-messages-per-poll=${SQS_MAX_MESSAGES_PER_POLL:5}
spring.cloud.aws.sqs.listener.poll-timeout=${SQS_POLL_TIMEOUT:10s}
# Deve ser >= lease-segundos para a mensagem nao ser reentregue durante o processamento
spring.cloud.aws.sqs.listener.visibility-timeout=${SQS_VISIBILITY_TIMEOUT:300s}
# Tempo maximo que um evento pode ficar PROCESSANDO antes de outra instancia assumi-lo
app.eventos-externos.lease-segundos=${EVENTOS_EXTERNOS_LEASE_SEGUNDOS:300}

# Datadog RUM
datadog.rum.client-token=${DD_RUM_CLIENT_TOKEN:}
datadog.rum.application-id=${DD_RUM_APPLICATION_ID:}


# Cookies web: HTTPS em producao; AUTH_COOKIE_SECURE=false somente no HTTP local
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:8080}

# Parcelamento no cartao de credito (regra de negocio configuravel)
app.pagamento.parcelamento.valor-minimo=${PAGAMENTO_PARCELAMENTO_VALOR_MINIMO:100.00}
app.pagamento.parcelamento.max-parcelas=${PAGAMENTO_PARCELAMENTO_MAX_PARCELAS:3}
