spring.application.name=rei-dos-piratas
server.port=8080

#Database
spring.profiles.active=prod
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Segurança do Banco e Logs
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# A trava do Hikari
spring.datasource.hikari.maximum-pool-size=3

# Flyway
spring.flyway.encoding=UTF-8
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db.migracao
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret= ${JWT_SECRET:596ae32c4416ca33e49258505dac9b7784292767303ce6f03926e86359009ca6ea5cd5d7}
jwt.expiration= ${JWT_EXPIRATION:86400000}

logging.level.org.springframework.security=TRACE
logging.level.br.com.fiap.projectmgtmvc=TRACE

# Feign Client Configuration
spring.cloud.openfeign.client.config.default.url=${ME_URL}
spring.cloud.openfeign.client.config.default.default-request-headers.accept=application/json
spring.cloud.openfeign.client.config.default.default-request-headers.user-agent=jonas.joliveira2024@gmail.com
spring.cloud.openfeign.client.config.default.connect-timeout=30000
spring.cloud.openfeign.client.config.default.read-timeout=30000
spring.cloud.openfeign.client.config.default.logger-level=basic

# Com contextId diferentes, definir URL por cliente evita fallback para load-balancer
spring.cloud.openfeign.client.config.frete-app.url=${ME_URL}
spring.cloud.openfeign.client.config.frete-token.url=${ME_URL}

# Habilita o Circuit Breaker integrado ao Feign (ativa uso de fallbackFactory)
spring.cloud.openfeign.circuitbreaker.enabled=true

spring.jackson.property-naming-strategy: SNAKE_CASE

# =============================================================================
# RESILIENCE4J ? Circuit Breaker calibrado para auto-scaling de 120s
# =============================================================================
# Instância "melhorEnvioApp": protege chamadas à API de frete (FreteAppClient)
# Instância "melhorEnvioToken": protege renovação de token (FreteTokenClient)
# =============================================================================

# --- Circuit Breaker: melhorEnvioApp ---
# Abre quando 50% das últimas 10 chamadas falham OU 70% são lentas (> 5s)
# Aguarda 130s em OPEN antes de testar (> 120s do auto-scaling)
resilience4j.circuitbreaker.instances.melhorEnvioApp.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.melhorEnvioApp.sliding-window-size=10
resilience4j.circuitbreaker.instances.melhorEnvioApp.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.melhorEnvioApp.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.melhorEnvioApp.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.instances.melhorEnvioApp.slow-call-rate-threshold=70
resilience4j.circuitbreaker.instances.melhorEnvioApp.wait-duration-in-open-state=130s
resilience4j.circuitbreaker.instances.melhorEnvioApp.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.melhorEnvioApp.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.melhorEnvioApp.register-health-indicator=true

# --- Circuit Breaker: melhorEnvioToken ---
resilience4j.circuitbreaker.instances.melhorEnvioToken.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.melhorEnvioToken.sliding-window-size=5
resilience4j.circuitbreaker.instances.melhorEnvioToken.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.melhorEnvioToken.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.melhorEnvioToken.slow-call-duration-threshold=10s
resilience4j.circuitbreaker.instances.melhorEnvioToken.slow-call-rate-threshold=70
resilience4j.circuitbreaker.instances.melhorEnvioToken.wait-duration-in-open-state=130s
resilience4j.circuitbreaker.instances.melhorEnvioToken.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.melhorEnvioToken.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.melhorEnvioToken.register-health-indicator=true

# --- Retry: tenta 2x antes de contar como falha ---
# Útil para falhas transitórias de rede/token durante scaling
resilience4j.retry.instances.melhorEnvioApp.max-attempts=2
resilience4j.retry.instances.melhorEnvioApp.wait-duration=500ms

resilience4j.retry.instances.melhorEnvioToken.max-attempts=2
resilience4j.retry.instances.melhorEnvioToken.wait-duration=1s

# --- Bulkhead: isola threads de chamadas externas do pool principal ---
# Previne que lentidão na API de frete bloqueie o restante da aplicação
resilience4j.bulkhead.instances.melhorEnvioApp.max-concurrent-calls=10
resilience4j.bulkhead.instances.melhorEnvioApp.max-wait-duration=500ms

resilience4j.bulkhead.instances.melhorEnvioToken.max-concurrent-calls=3
resilience4j.bulkhead.instances.melhorEnvioToken.max-wait-duration=500ms

# =============================================================================
# ACTUATOR ? Expõe /actuator/health e métricas do circuit breaker
# =============================================================================
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,bulkheads
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true
