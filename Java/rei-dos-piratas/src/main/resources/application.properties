## Segurança do Banco e Logs
#spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
#spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=true
spring.profiles.active=test
# H2 file-based: data persists in ./data/reidospiratas.mv.db across restarts
spring.datasource.url=jdbc:h2:file:./data/reidospiratas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 'update' preserves existing data; use 'none' if managing schema only via Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=never

# H2 Console (acessar via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# A trava do Hikari
spring.datasource.hikari.maximum-pool-size=3

# Flyway
spring.flyway.encoding=UTF-8
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db.migracao
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret= ${JWT_SECRET:596ae32c4416ca33e49258505dac9b7784292767303ce6f03926e86359009ca6ea5cd5d7}
jwt.expiration= ${JWT_EXPIRATION:86400000}

logging.level.org.springframework.security=TRACE
logging.level.br.com.fiap.projectmgtmvc=TRACE

# Feign Client Configuration
spring.cloud.openfeign.client.config.default.url=${ME_URL}
spring.cloud.openfeign.client.config.default.default-request-headers.accept=application/json
spring.cloud.openfeign.client.config.default.default-request-headers.user-agent=jonas.joliveira2024@gmail.com
spring.cloud.openfeign.client.config.default.connect-timeout=30000
spring.cloud.openfeign.client.config.default.read-timeout=30000
spring.cloud.openfeign.client.config.default.logger-level=basic

# Com contextId diferentes, definir URL por cliente evita fallback para load-balancer
spring.cloud.openfeign.client.config.frete-app.url=${ME_URL}
spring.cloud.openfeign.client.config.frete-token.url=${ME_URL}

spring.jackson.property-naming-strategy: SNAKE_CASE