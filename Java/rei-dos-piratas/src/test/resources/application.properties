spring.application.name=rei-dos-piratas
# H2 settings
spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=never
server.port=0

# Flyway
spring.flyway.encoding=UTF-8
spring.flyway.enabled=true
spring.flyway.locations=classpath:db.migracao
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret= ${JWT_SECRET:596ae32c4416ca33e49258505dac9b7784292767303ce6f03926e86359009ca6ea5cd5d7}
jwt.expiration= ${JWT_EXPIRATION:86400000}

logging.level.org.springframework.security=TRACE
logging.level.br.com.fiap.projectmgtmvc=TRACE

#melhor envio
ME_SECRET= ${ME_SECRET:teste-secret}

spring.jackson.property-naming-strategy: SNAKE_CASE