trigger:
  branches:
    include:
      - main

variables:
  azureServiceConnectionId: "asc-rei-dos-piratas"
  webAppName: "rei-dos-piratas-app"
  projectDirectory: "Java/rei-dos-piratas"

stages:
  - stage: Build
    displayName: "Build Stage"
    jobs:
      - job: Build
        displayName: "Build and Package"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: JavaToolInstaller@0
            displayName: "Set up Java 21"
            inputs:
              versionSpec: "21"
              jdkArchitectureOption: "x64"
              jdkSourceOption: "PreInstalled"

          - script: mvn -B clean package
            workingDirectory: $(projectDirectory)
            displayName: "Build with Maven"

          - script: ls -lah $(projectDirectory)/target && ls -lah $(projectDirectory)/target/*.jar
            displayName: "Verify JAR exists"

          - task: PublishPipelineArtifact@1
            displayName: "Upload artifact for deployment job"
            inputs:
              targetPath: "$(projectDirectory)/target"
              artifact: "java-app"
              publishLocation: "pipeline"

  - stage: Deploy
    displayName: "Deploy Stage"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployWebApp
        displayName: "Deploy to Azure Web App"
        environment: "Production"
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                # O deployment job baixa os artefatos automaticamente, mas podemos ser explícitos
                - task: DownloadPipelineArtifact@2
                  displayName: "Download artifact from build job"
                  inputs:
                    buildType: "current"
                    artifactName: "java-app"
                    targetPath: "$(System.DefaultWorkingDirectory)/artifact"

                - script: ls -lah $(System.DefaultWorkingDirectory)/artifact && ls -lah $(System.DefaultWorkingDirectory)/artifact/*.jar
                  displayName: "Verify downloaded JAR"

                - task: AzureWebApp@1
                  displayName: "Deploy to Azure Web App"
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    appType: "webAppLinux" # Mude para 'webApp' se o seu App Service for Windows
                    appName: $(webAppName)
                    package: "$(System.DefaultWorkingDirectory)/artifact/*.jar"
                    # Se você realmente usa um Slot chamado Production diferente do principal, descomente as linhas abaixo:
                    # deployToSlotOrASE: true
                    # resourceGroupName: 'SEU_RESOURCE_GROUP'
                    # slotName: 'Production'
